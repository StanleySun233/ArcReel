name: Private Docker Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-docker-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: arcreel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: version
        run: |
          DATE_PART=$(TZ=Asia/Shanghai date +'%m%d')
          SHORT_SHA=$(git rev-parse --short=4 HEAD)
          RELEASE_TAG="2.6.${DATE_PART}"
          IMAGE_TAG="${RELEASE_TAG}-${SHORT_SHA}"
          echo "$IMAGE_TAG" > VERSION
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve registry host
        id: registry
        env:
          RAW_REGISTRY: ${{ secrets.CAMEL_REGISTRY }}
        run: |
          REGISTRY_HOST="${RAW_REGISTRY#http://}"
          REGISTRY_HOST="${REGISTRY_HOST#https://}"
          REGISTRY_HOST="${REGISTRY_HOST%%/*}"
          if [ -z "$REGISTRY_HOST" ]; then
            echo "CAMEL_REGISTRY is empty" >&2
            exit 1
          fi
          echo "host=$REGISTRY_HOST" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.CAMEL_ACCOUNT }}
          password: ${{ secrets.CAMEL_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.registry.outputs.host }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ steps.registry.outputs.host }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.release_tag }}
            ${{ steps.registry.outputs.host }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=arcreel
          cache-to: type=gha,mode=max,scope=arcreel
          provenance: false
          sbom: false
