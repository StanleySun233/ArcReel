name: Private Docker Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-docker-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: arcreel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: version
        run: |
          DATE_PART=$(TZ=Asia/Shanghai date +'%m%d')
          SHORT_SHA=$(git rev-parse --short HEAD)
          APP_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')
          IMAGE_TAG="v${APP_VERSION}.${DATE_PART}-dev-r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}"
          echo "$IMAGE_TAG" > VERSION
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CAMEL_REGISTRY }}
          username: ${{ secrets.CAMEL_ACCOUNT }}
          password: ${{ secrets.CAMEL_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.CAMEL_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ secrets.CAMEL_REGISTRY }}/${{ env.IMAGE_NAME }}:private-dev
          cache-from: type=gha,scope=arcreel
          cache-to: type=gha,mode=max,scope=arcreel
          provenance: false
          sbom: false
