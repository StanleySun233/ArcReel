name: Private Docker Base

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.base
      - pyproject.toml
      - uv.lock
      - README.md
      - .github/workflows/private-docker-base.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-docker-base
  cancel-in-progress: false

env:
  BASE_IMAGE_NAME: arcreel-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve tag
        id: version
        run: |
          DATE_PART=$(TZ=Asia/Shanghai date +'%m%d')
          SHORT_SHA=$(git rev-parse --short=4 HEAD)
          IMAGE_TAG="2.6.${DATE_PART}-base-${SHORT_SHA}"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve registry host
        id: registry
        env:
          RAW_REGISTRY: ${{ secrets.CAMEL_REGISTRY }}
        run: |
          REGISTRY_HOST="${RAW_REGISTRY#http://}"
          REGISTRY_HOST="${REGISTRY_HOST#https://}"
          REGISTRY_HOST="${REGISTRY_HOST%%/*}"
          if [ -z "$REGISTRY_HOST" ]; then
            echo "CAMEL_REGISTRY is empty" >&2
            exit 1
          fi
          echo "host=$REGISTRY_HOST" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.CAMEL_ACCOUNT }}
          password: ${{ secrets.CAMEL_PASSWORD }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.registry.outputs.host }}/${{ env.BASE_IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ steps.registry.outputs.host }}/${{ env.BASE_IMAGE_NAME }}:private-dev
            ${{ steps.registry.outputs.host }}/${{ env.BASE_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=arcreel-base
          cache-to: type=gha,mode=max,scope=arcreel-base
          provenance: false
          sbom: false
