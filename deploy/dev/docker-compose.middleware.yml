name: arcreel-dev

services:
  postgres:
    image: postgres:18-alpine
    shm_size: "1gb"
    environment:
      POSTGRES_USER: ${ARCREEL_DEV_POSTGRES_USER:-arcreel}
      POSTGRES_PASSWORD: ${ARCREEL_DEV_POSTGRES_PASSWORD:-arcreel_dev_password}
      POSTGRES_DB: ${ARCREEL_DEV_POSTGRES_DB:-arcreel}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ARCREEL_DEV_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-app-role-init:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${ARCREEL_DEV_POSTGRES_DB:-arcreel}
      PGUSER: ${ARCREEL_DEV_POSTGRES_USER:-arcreel}
      PGPASSWORD: ${ARCREEL_DEV_POSTGRES_PASSWORD:-arcreel_dev_password}
      POSTGRES_DB: ${ARCREEL_DEV_POSTGRES_DB:-arcreel}
      ARCREEL_DEV_POSTGRES_APP_USER: ${ARCREEL_DEV_POSTGRES_APP_USER:-arcreel_app}
      ARCREEL_DEV_POSTGRES_APP_PASSWORD: ${ARCREEL_DEV_POSTGRES_APP_PASSWORD:-arcreel_app_dev_password}
    volumes:
      - ./postgres-init-app-role.sh:/usr/local/bin/arcreel-postgres-init-app-role:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/arcreel-postgres-init-app-role"]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${ARCREEL_DEV_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ARCREEL_DEV_MINIO_ROOT_USER:-arcreelminio}
      MINIO_ROOT_PASSWORD: ${ARCREEL_DEV_MINIO_ROOT_PASSWORD:-arcreel_minio_dev_password}
    ports:
      - "${ARCREEL_DEV_MINIO_API_PORT:-19000}:9000"
      - "${ARCREEL_DEV_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${ARCREEL_DEV_MINIO_ROOT_USER:-arcreelminio}
      MINIO_ROOT_PASSWORD: ${ARCREEL_DEV_MINIO_ROOT_PASSWORD:-arcreel_minio_dev_password}
      ARCREEL_FILES_BUCKET: ${ARCREEL_DEV_MINIO_BUCKET:-arcreel-files}
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - >
        mc alias set arcreel http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "arcreel/$${ARCREEL_FILES_BUCKET}" &&
        mc anonymous set none "arcreel/$${ARCREEL_FILES_BUCKET}"
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
